{% extends "base.html" %}{% block content %}<span class="eyebrow">按段落整理</span><h1>翻译术语参考</h1><p class="lead">识别已登记词形，查看义项、备选与项目条件。此工具整理参考，不生成整段译文。</p>
<form id="translation-form"><label for="text">待译原文</label><textarea id="text" name="text" rows="7" required placeholder="Arbeitskraft, abstrakte Arbeit und Wert."></textarea>
<div class="filters"><label>项目方案<select name="profile_id" id="profile">{% for p in meta.profiles %}<option value="{{ p.id }}" data-source="{{ p.source_language }}" data-target="{{ p.target_language }}">{{ p.title }} · {{ p.source_language }} → {{ p.target_language }}</option>{% endfor %}</select></label><label>作品<select name="work_id"><option value="">未指定作品</option>{% for w in meta.works %}<option value="{{ w.id }}">{{ w.title }}</option>{% endfor %}</select></label><label>源版本<select name="edition_id"><option value="">未指定版本</option>{% for e in meta.editions %}<option value="{{ e.id }}">{{ e.language }} · {{ e.title }}</option>{% endfor %}</select></label></div>
<label>显式义项（可选）<input name="sense_id" placeholder="例如 sense-de-aufhebung-aufhebung-property"></label><button>整理术语参考</button></form>
<p id="translation-status" role="status" aria-live="polite"></p><div id="translation-result"></div>{% endblock %}
